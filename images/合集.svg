<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 348" width="348" height="348" role="img" aria-label="九本合集電子書">
  <defs>
    <linearGradient id="hj-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf2f5"/>
      <stop offset="1" stop-color="#f0d2dd"/>
    </linearGradient>
    <linearGradient id="hj-book1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e089ac"/>
      <stop offset="1" stop-color="#a63e6a"/>
    </linearGradient>
    <linearGradient id="hj-book2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8e7ec"/>
    </linearGradient>
    <linearGradient id="hj-book3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#632445"/>
      <stop offset="1" stop-color="#43182f"/>
    </linearGradient>
  </defs>

  <rect width="348" height="348" rx="28" fill="url(#hj-bg)"/>
  <circle cx="174" cy="168" r="128" fill="none" stroke="#e5b3c5" stroke-width="1.2" stroke-dasharray="2 7"/>

  <!-- 三冊疊放書籍 -->
  <g stroke-linejoin="round">
    <g transform="translate(174 236) rotate(-4) translate(-88 -66)">
      <rect x="0" y="0" width="176" height="118" rx="10" fill="url(#hj-book3)"/>
      <rect x="0" y="0" width="14" height="118" rx="7" fill="rgba(0,0,0,.22)"/>
    </g>
    <g transform="translate(174 210) rotate(3) translate(-86 -60)">
      <rect x="0" y="0" width="172" height="112" rx="10" fill="url(#hj-book2)" stroke="#f0d2dd"/>
      <rect x="0" y="0" width="13" height="112" rx="6.5" fill="#f0d2dd"/>
      <rect x="32" y="22" width="110" height="6" rx="3" fill="#e5b3c5"/>
      <rect x="32" y="40" width="84" height="6" rx="3" fill="#f0d2dd"/>
    </g>
    <g transform="translate(174 166) rotate(-2) translate(-84 -58)">
      <rect x="0" y="0" width="168" height="108" rx="10" fill="url(#hj-book1)"/>
      <rect x="0" y="0" width="13" height="108" rx="6.5" fill="rgba(255,255,255,.18)"/>
      <!-- 書面蓮花印記 -->
      <g transform="translate(96 54)" fill="none" stroke="#fdeef3" stroke-width="2.4" stroke-linecap="round">
        <path d="M0-20c7 7 10 15 10 23-7 4-13 4-20 0 0-8 3-16 10-23z" transform="scale(.9)"/>
        <path d="M-16 6c-4-7-4-14 2-20"/>
        <path d="M16 6c4-7 4-14-2-20"/>
      </g>
    </g>
  </g>

  <text x="174" y="318" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="21" font-weight="700" fill="#632445" letter-spacing="6">九本合集</text>
</svg>
