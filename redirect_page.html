<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=../wenda2_ebook/">
    <title>頁面跳轉 - 坐禪之問答錄</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <style>
        body {
            font-family: 'Helvetica', 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .redirect-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(231, 84, 128, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #f8c8dc;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #e75480, #ff69b4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            font-weight: bold;
        }

        h1 {
            color: #e75480;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }

        .countdown-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #e75480;
        }

        .countdown-text {
            font-size: 18px;
            color: #e75480;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .countdown-number {
            font-size: 48px;
            font-weight: bold;
            color: #e75480;
            margin: 10px 0;
            font-family: 'Georgia', serif;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e75480, #ff69b4);
            border-radius: 4px;
            transition: width 1s ease;
            width: 0%;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e75480, #ff69b4);
            color: white;
            box-shadow: 0 4px 12px rgba(231, 84, 128, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(231, 84, 128, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #e75480;
            border: 2px solid #e75480;
        }

        .btn-secondary:hover {
            background: #e75480;
            color: white;
        }

        .features {
            margin-top: 30px;
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .features h3 {
            color: #e75480;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .features ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .features li {
            padding: 5px 0;
            color: #666;
            position: relative;
            padding-left: 25px;
        }

        .features li:before {
            content: "✨";
            position: absolute;
            left: 0;
            top: 5px;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-switch a {
            color: #e75480;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #e75480;
            transition: all 0.2s;
        }

        .lang-switch a:hover {
            background: #e75480;
            color: white;
        }

        .lang-switch a.active {
            background: #e75480;
            color: white;
        }

        @media (max-width: 600px) {
            .redirect-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .countdown-number {
                font-size: 36px;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- 語言切換 -->
    <div class="lang-switch">
        <a href="#" class="active" onclick="switchLanguage('zh')" id="zh-link">繁體</a>
        <a href="#" onclick="switchLanguage('en')" id="en-link">简体</a>
    </div>

    <div class="redirect-container">
        <div class="logo">禪</div>
        
        <h1 id="title">頁面跳轉通知</h1>
        
        <div class="message" id="message">
            我們已經升級到新版本的坐禪之問答錄！<br>
            新版本包含更好的搜索功能、改進的用戶體驗和全新的功能。
        </div>

        <div class="countdown-container">
            <div class="countdown-text" id="countdown-text">頁面將在以下時間後自動跳轉：</div>
            <div class="countdown-number" id="countdown">5</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>

        <div class="button-group">
            <a href="../wenda2_ebook/" class="btn btn-primary" id="go-now">立即前往新版</a>
            <button class="btn btn-secondary" onclick="cancelRedirect()" id="cancel-btn">取消跳轉</button>
        </div>

        <div class="features">
            <h3 id="features-title">🎉 新版本特色</h3>
            <ul id="features-list">
                <li>✅ 全文搜索功能，帶載入進度提示</li>
                <li>🌏 完整的簡繁體支持</li>
                <li>📱 響應式設計，完美支持手機閱讀</li>
                <li>🔖 智能書籤功能</li>
                <li>🎨 全新的界面設計</li>
                <li>⚡ 更快的載入速度</li>
            </ul>
        </div>
    </div>

    <script>
        // 多語言支持
        const translations = {
            zh: {
                title: "頁面跳轉通知",
                message: "我們已經升級到新版本的坐禪之問答錄！<br>新版本包含更好的搜索功能、改進的用戶體驗和全新的功能。",
                countdownText: "頁面將在以下時間後自動跳轉：",
                goNow: "立即前往新版",
                cancelBtn: "取消跳轉",
                featuresTitle: "🎉 新版本特色",
                features: [
                    "✅ 全文搜索功能，帶載入進度提示",
                    "🌏 完整的簡繁體支持", 
                    "📱 響應式設計，完美支持手機閱讀",
                    "🔖 智能書籤功能",
                    "🎨 全新的界面設計",
                    "⚡ 更快的載入速度"
                ]
            },
            en: {
                title: "页面跳转通知",
                message: "我们已经升级到新版本的坐禅之问答录！<br>新版本包含更好的搜索功能、改进的用户体验和全新的功能。",
                countdownText: "页面将在以下时间后自动跳转：",
                goNow: "立即前往新版",
                cancelBtn: "取消跳转", 
                featuresTitle: "🎉 新版本特色",
                features: [
                    "✅ 全文搜索功能，带加载进度提示",
                    "🌏 完整的简繁体支持",
                    "📱 响应式设计，完美支持手机阅读", 
                    "🔖 智能书签功能",
                    "🎨 全新的界面设计",
                    "⚡ 更快的加载速度"
                ]
            }
        };

        let currentLang = 'zh';
        let countdown = 5;
        let timer = null;
        let redirectCancelled = false;

        function switchLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('title').innerHTML = t.title;
            document.getElementById('message').innerHTML = t.message;
            document.getElementById('countdown-text').innerHTML = t.countdownText;
            document.getElementById('go-now').innerHTML = t.goNow;
            document.getElementById('cancel-btn').innerHTML = t.cancelBtn;
            document.getElementById('features-title').innerHTML = t.featuresTitle;
            
            const featuresList = document.getElementById('features-list');
            featuresList.innerHTML = '';
            t.features.forEach(feature => {
                const li = document.createElement('li');
                li.innerHTML = feature;
                featuresList.appendChild(li);
            });

            // 更新語言切換按鈕狀態
            document.getElementById('zh-link').classList.toggle('active', lang === 'zh');
            document.getElementById('en-link').classList.toggle('active', lang === 'en');
        }

        function updateCountdown() {
            const countdownEl = document.getElementById('countdown');
            const progressEl = document.getElementById('progress');
            
            if (redirectCancelled) {
                return;
            }

            countdownEl.textContent = countdown;
            const progress = ((5 - countdown) / 5) * 100;
            progressEl.style.width = progress + '%';

            if (countdown <= 0) {
                window.location.href = '../wenda2_ebook/';
                return;
            }

            countdown--;
        }

        function cancelRedirect() {
            redirectCancelled = true;
            clearInterval(timer);
            
            const countdownContainer = document.querySelector('.countdown-container');
            countdownContainer.innerHTML = `
                <div class="countdown-text" style="color: #666;">
                    ⏸️ 自動跳轉已取消
                </div>
                <div style="margin-top: 10px; color: #999; font-size: 14px;">
                    您可以隨時點擊上方按鈕前往新版本
                </div>
            `;
        }

        // 啟動倒計時
        function startCountdown() {
            updateCountdown();
            timer = setInterval(updateCountdown, 1000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            startCountdown();
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                window.location.href = '../wenda2_ebook/';
            } else if (e.key === 'Escape') {
                cancelRedirect();
            }
        });
    </script>
</body>
</html>
