<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 音檔 Mapping 微調</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>Audio Map</h1>
        <p class="hint">微調 PDF 章節 ↔ 音檔區間（不改正文）</p>
      </header>
      <label class="field">
        <span>月份</span>
        <select id="monthSelect"></select>
      </label>
      <nav id="sessionList" class="session-list" aria-label="Session 列表"></nav>
      <div class="sidebar-actions">
        <button type="button" id="reloadBtn" class="btn">重新載入</button>
        <button type="button" id="downloadBtn" class="btn">下載 JSON</button>
        <button type="button" id="saveGithubBtn" class="btn btn-primary">存到 GitHub</button>
      </div>
      <p id="statusMsg" class="status" role="status"></p>
    </aside>

    <main class="main">
      <section id="welcome" class="welcome">
        <h2>選擇左側 session 開始微調</h2>
        <p>播放使用 <code>../audio/*.opus</code>。調整後標記為 <code>manual</code> 並可鎖定，重跑 align 不會覆蓋。</p>
        <p>設定裡可填 GitHub PAT（僅需本 repo Contents 讀寫）。</p>
        <button type="button" id="settingsBtn" class="btn">設定 PAT</button>
      </section>

      <section id="editor" class="editor hidden">
        <header class="editor-header">
          <div>
            <h2 id="sessionTitle"></h2>
            <p id="sessionMeta" class="meta"></p>
          </div>
          <div class="editor-actions">
            <label class="check"><input type="checkbox" id="stopAtEnd" checked> 播到結尾停</label>
            <button type="button" id="settingsBtn2" class="btn">設定</button>
          </div>
        </header>
        <div id="cards" class="cards"></div>
      </section>
    </main>
  </div>

  <aside id="miniPlayer" class="mini-player hidden" aria-label="播放器">
    <div class="mini-title" id="playerTitle">尚未播放</div>
    <div class="mini-range" id="playerRange"></div>
    <div class="mini-controls">
      <button type="button" data-seek="-5">−5s</button>
      <button type="button" id="playerToggle" class="primary">▶</button>
      <button type="button" data-seek="5">+5s</button>
      <button type="button" id="playerClose">✕</button>
    </div>
    <audio id="audioEl" preload="none"></audio>
  </aside>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <h2>設定</h2>
      <label class="field">
        <span>GitHub Fine-grained PAT</span>
        <input id="patInput" type="password" autocomplete="off" placeholder="github_pat_...">
      </label>
      <p class="hint">Token 存於本機 localStorage。權限：此 repo 的 Contents Read and write。</p>
      <menu>
        <button value="cancel" class="btn">關閉</button>
        <button id="savePatBtn" value="default" class="btn btn-primary">儲存</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
