[api]
# API類型選擇
type = chatmock

[openai]
# OpenAI API設定
api_key = 
model = gpt-4o
temperature = 0.3
max_tokens = 1000

[chatmock]
# ChatMock本地服務器設定
base_url = http://127.0.0.1:8000/v1
model = gpt-5
reasoning_effort = medium
reasoning_summary = auto

[excel]
# Excel文件設定
file_path = 坐禅问答汇总 20250810.xlsx
sheet_name = 答疑汇总
# 問題列（H列，第8列）
question_column = 8
# 答案列（I列，第9列）
answer_column = 9

[output]
# 輸出列位置設定（可調整）
classification_column = 20
reason_column = 21
question_summary_column = 22
answer_summary_column = 23

[processing]
# 處理設定
start_row = 2
end_row = 12
batch_size = 10
